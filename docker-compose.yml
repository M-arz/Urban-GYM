# ============================================================================
# Urban GYM – Docker Compose (Orquestación del sistema completo)
# ============================================================================
# Uso:  docker compose up -d
# Logs: docker compose logs -f [servicio]
# Stop: docker compose down
# ============================================================================

services:

  # ── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      args:
        PORT: 3000
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MEMBER_SERVICE_URL=http://member-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:3002
      - FACILITY_SERVICE_URL=http://facility-service:3003
      - IOT_SERVICE_URL=http://iot-service:3004
      - PROGRESS_SERVICE_URL=http://workout-progress-service:3005
      - BILLING_SERVICE_URL=http://billing-service:3006
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3007
    depends_on:
      - member-service
      - booking-service
      - facility-service
      - iot-service
      - workout-progress-service
      - billing-service
      - recommendation-service
    networks:
      - urbangym-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Member Service ───────────────────────────────────────────────────────
  member-service:
    build:
      context: ./member-service
      args:
        PORT: 3001
    ports:
      - "3001:3001"
    env_file:
      - ./member-service/.env
    environment:
      - PORT=3001
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Booking Service ──────────────────────────────────────────────────────
  booking-service:
    build:
      context: ./booking-service
      args:
        PORT: 3002
    ports:
      - "3002:3002"
    env_file:
      - ./booking-service/.env
    environment:
      - PORT=3002
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Facility Service ─────────────────────────────────────────────────────
  facility-service:
    build:
      context: ./facility-service
      args:
        PORT: 3003
    ports:
      - "3003:3003"
    env_file:
      - ./facility-service/.env
    environment:
      - PORT=3003
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── IoT Service ──────────────────────────────────────────────────────────
  iot-service:
    build:
      context: ./iot-service
      args:
        PORT: 3004
    ports:
      - "3004:3004"
    env_file:
      - ./iot-service/.env
    environment:
      - PORT=3004
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Workout Progress Service ─────────────────────────────────────────────
  workout-progress-service:
    build:
      context: ./workout-progress-service
      args:
        PORT: 3005
    ports:
      - "3005:3005"
    env_file:
      - ./workout-progress-service/.env
    environment:
      - PORT=3005
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Billing Service ──────────────────────────────────────────────────────
  billing-service:
    build:
      context: ./billing-service
      args:
        PORT: 3006
    ports:
      - "3006:3006"
    env_file:
      - ./billing-service/.env
    environment:
      - PORT=3006
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Recommendation Service ───────────────────────────────────────────────
  recommendation-service:
    build:
      context: ./recommendation-service
      args:
        PORT: 3007
    ports:
      - "3007:3007"
    env_file:
      - ./recommendation-service/.env
    environment:
      - PORT=3007
    networks:
      - urbangym-network
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - urbangym-network
    restart: unless-stopped

# ── Red interna ────────────────────────────────────────────────────────────
networks:
  urbangym-network:
    driver: bridge
